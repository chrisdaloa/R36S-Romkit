<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogo giochi</title>
<style>
:root{
 --bg:#f2f3f8;--pn:#fff;--pn2:#eceef6;--ln:#dcdfeb;--tx:#171a29;--mu:#646a85;
 --ac:#4b46e5;--act:#fff;--ok:#0f8f5f;--wa:#b86e00;--er:#d93a3a;--sh:0 10px 30px rgba(20,24,50,.18);
 --r:12px;--hd:58px;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#12141c;--pn:#1a1d28;--pn2:#232738;--ln:#2d3247;--tx:#e8eaf3;--mu:#8d93ab;
 --ac:#8480ff;--act:#10112a;--ok:#4cd8a0;--wa:#f5b14c;--er:#ff7272;--sh:0 10px 30px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html{scrollbar-color:var(--ln) transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Inter","Segoe UI",system-ui,sans-serif;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:var(--tx)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* barra in alto */
.top{position:sticky;top:0;z-index:20;height:var(--hd);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:400;color:var(--mu);font-size:13px}
.search{position:relative;flex:1;max-width:520px}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--mu);pointer-events:none}
.search input{width:100%;height:38px;padding:0 12px 0 38px;background:var(--pn);border:1px solid var(--ln);border-radius:999px}
.search input::placeholder{color:var(--mu)}
.count{color:var(--mu);white-space:nowrap}
.sp{flex:1}
.seg{display:inline-flex;padding:3px;background:var(--pn2);border-radius:10px;gap:2px}
.seg button{border:0;background:none;color:var(--mu);padding:5px 11px;border-radius:8px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--pn);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg button:hover:not([aria-pressed=true]){color:var(--tx)}
select,input[type=number],input[type=text]{background:var(--pn);border:1px solid var(--ln);border-radius:9px;padding:7px 10px;min-width:0}
select{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--mu)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--act);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--er)}
.link{background:none;border:0;color:var(--mu);padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--tx)}
.sortw{display:flex;align-items:center;gap:8px;color:var(--mu)}
.sortw select{width:auto}
.packbtn{gap:10px}
.packbtn .mini{width:42px;height:6px;border-radius:3px;background:var(--pn2);overflow:hidden}
.packbtn .mini i{display:block;height:100%;width:0;background:var(--ac)}
.packbtn .mini.ov i{background:var(--er)}
.only-n{display:none}
.warn{background:color-mix(in srgb,var(--er) 14%,var(--bg));color:var(--er);padding:8px 18px;font-weight:600;border-bottom:1px solid var(--ln)}

/* struttura */
.body{display:grid;grid-template-columns:260px minmax(0,1fr);align-items:start}
body.dr .body{grid-template-columns:260px minmax(0,1fr) 340px}
aside{position:sticky;top:var(--hd);height:calc(100vh - var(--hd));overflow:auto;padding:16px 16px 28px;background:var(--bg)}
.filters{border-right:1px solid var(--ln)}
.drawer{border-left:1px solid var(--ln)}
aside section{margin-bottom:20px}
aside h2{font-size:15px;margin:0}
aside h3{font-size:13px;font-weight:600;color:var(--mu);margin:0 0 8px}
.fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.syl{display:flex;flex-direction:column;gap:1px;max-height:44vh;overflow:auto;margin:0 -6px;padding:0 6px}
.syl button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:6px 9px;border-radius:8px;color:var(--tx)}
.syl button span{color:var(--mu)}
.syl button:hover{background:var(--pn2)}
.syl button[aria-pressed=true]{background:var(--ac);color:var(--act);font-weight:600}
.syl button[aria-pressed=true] span{color:inherit;opacity:.8}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg.full{display:flex}.seg.full button{flex:1}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer}
.chk input{accent-color:var(--ac);width:16px;height:16px}

/* griglia */
main{padding:18px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px;align-content:start}
.c{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s,transform .12s}
.c:hover{border-color:var(--ac)}
.im{position:relative;overflow:hidden;aspect-ratio:4/3;background:#0d0e14;display:flex;align-items:center;justify-content:center;color:#8d93ab;font-size:12px;text-align:center;padding:10px}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tx{padding:9px 12px 11px}
.t{font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.m{color:var(--mu);font-size:12px;margin-top:3px}
.b{display:inline-block;margin-left:4px;padding:0 6px;border-radius:5px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-weight:700;font-size:11px}
.st{color:var(--wa);letter-spacing:1px;font-size:12px}
.sel{position:absolute;top:8px;right:8px;width:24px;height:24px;margin:0;appearance:none;border-radius:50%;background:rgba(10,11,20,.55);border:2px solid #fff;cursor:pointer;z-index:1;display:grid;place-items:center}
.sel:checked{background:var(--ac);border-color:var(--ac)}
.sel:checked::after{content:"";width:6px;height:11px;border:solid var(--act);border-width:0 2.5px 2.5px 0;rotate:45deg;translate:0 -1px}
body:not(.pk) .sel{display:none}
.c.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--pn));box-shadow:0 0 0 1px var(--ac),0 6px 18px color-mix(in srgb,var(--ac) 28%,transparent)}
.c.on .t{color:var(--ac)}
body.pk .c:not(.on) .im,body.pk .c:not(.on) .tx{opacity:.6}
body.pk .c:not(.on):hover .im,body.pk .c:not(.on):hover .tx{opacity:1}
.prog{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .4s}
.prog.ind i{width:35%;animation:ind 1.4s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:65%}}
#più{display:block;margin:0 auto 40px}

/* elenco */
main.lista{display:block;padding:8px 20px 40px}
main.lista .c{flex-direction:row;align-items:center;border-radius:0;border-width:0 0 1px;background:none;padding:6px 4px;gap:12px}
main.lista .c:hover{background:var(--pn)}
main.lista .c.on{box-shadow:inset 4px 0 0 var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent);border-bottom-color:color-mix(in srgb,var(--ac) 40%,var(--ln))}
main.lista .im{width:48px;height:36px;aspect-ratio:auto;flex:none;font-size:0;padding:0;border-radius:6px;overflow:hidden}
main.lista .tx{flex:1;min-width:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr) 230px 80px;gap:14px;align-items:center}
main.lista .m{margin:0}
main.lista .st{text-align:right}
main.lista .sel{position:static;order:-1;margin-left:6px}

/* pannello pack */
.drawer h2{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{margin-bottom:10px}
.gauge{position:relative;height:74px;background:var(--pn2);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);border-radius:8px;overflow:hidden}
.gauge .f,.gauge .r{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .25s}
.gauge .f{background:var(--ac)}
.gauge .r{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ac) 45%,transparent) 0 6px,transparent 6px 12px)}
.gauge.ov .f{background:var(--er)}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 14px}
.gauge b{font-size:22px;letter-spacing:-.02em;line-height:1.1;text-shadow:0 0 6px var(--pn2),0 0 2px var(--pn2)}
.gauge small{color:var(--tx);opacity:.8;text-shadow:0 0 6px var(--pn2),0 0 2px var(--pn2)}
.note{margin:10px 0 0;color:var(--mu);font-size:13px}
.note.ov{color:var(--er);font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.f2 label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px}
.f2 input{width:100%}
.stack{display:flex;flex-direction:column;gap:8px}
.drawer .stack .row .btn{flex:1}

/* finestre */
.ov-b{position:fixed;inset:0;background:rgba(6,7,14,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.bx{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:16px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--sh)}
#pn .bx{max-width:800px;display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px}
#rs .bx{max-width:680px}
#pi img{width:100%;border-radius:10px;background:#0d0e14}
#pn h2,#rs h2{margin:0 0 8px;font-size:20px;letter-spacing:-.01em}
#pn dl{margin:12px 0;display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
#pn dt{color:var(--mu)}#pn dd{margin:0;overflow-wrap:anywhere}
#pn p{color:var(--tx);opacity:.9}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--pn2)}
.x:hover{background:var(--ln)}
.gioca{display:inline-flex;margin:10px 10px 0 0;padding:9px 18px;background:var(--ac);color:var(--act);border-radius:10px;text-decoration:none;font-weight:600}
#rs table{width:100%;border-collapse:collapse;font-size:13px}
#rs td,#rs th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--ln)}
#rs th{color:var(--mu);font-weight:600}
#rs td:first-child,#rs th:first-child{text-align:left}

@media (max-width:1180px){
 body.dr .body{grid-template-columns:260px minmax(0,1fr)}
 .drawer{position:fixed;right:0;top:var(--hd);width:min(360px,100vw);z-index:30;box-shadow:var(--sh);background:var(--bg)}
}
@media (max-width:860px){
 .body,body.dr .body{grid-template-columns:minmax(0,1fr)}
 .only-n{display:inline-flex}
 .filters{position:fixed;left:0;top:var(--hd);width:min(300px,100vw);z-index:30;box-shadow:var(--sh);translate:-105% 0;transition:translate .2s}
 body.fl .filters{translate:0}
 .top{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}
 :root{--hd:104px}
 .search{order:5;flex-basis:100%;max-width:none}
 .count,.sortw span,.brand small{display:none}
 #pn .bx{grid-template-columns:1fr}
 main.lista .tx{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">romkit <small>catalogo giochi</small></div>
 <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cerca un titolo" aria-label="Cerca"></div>
 <span id="cont" class="count"></span>
 <span class="sp"></span>
 <button id="fb" class="btn only-n" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtri</button>
 <label class="sortw"><span>Ordina per</span><select id="o" aria-label="Ordine"><option value="t">Titolo</option><option value="y">Anno (recenti)</option><option value="r">Valutazione</option><option value="sz">Dimensione</option><option value="s">Sistema</option></select></label>
 <div class="seg" id="vs" role="group" aria-label="Vista"></div>
 <button id="pkb" class="btn packbtn" type="button" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M10 3v4M13 3v4"/></svg><span id="pkn">Pack</span><span class="mini" id="pkm"><i></i></span></button>
</header>
<div id="av" class="warn" hidden>Pack non salvati sul NAS: il NAS non è raggiungibile. Le modifiche restano in questo browser.</div>
<div class="body">
 <aside id="fl" class="filters" aria-label="Filtri">
  <div class="fh"><h2>Filtri</h2><button id="rz" class="link" type="button">Azzera</button></div>
  <section><h3>Sistema</h3><input id="s" type="hidden" value=""><div id="sl" class="syl"></div></section>
  <section><h3>Genere</h3><select id="ge" aria-label="Genere"><option value="">Tutti i generi</option></select></section>
  <section><h3>Lingua</h3><select id="lg" aria-label="Lingua"><option value="">Tutte le lingue</option></select></section>
  <section><h3>Giocatori</h3><div class="seg full" id="pl" role="group" aria-label="Giocatori"></div></section>
  <section><h3>Voto minimo</h3><div class="seg full" id="mr" role="group" aria-label="Valutazione minima"></div></section>
  <section><h3>Anno</h3><div class="row"><input id="a1" type="number" placeholder="Da" min="1970" max="2030" aria-label="Anno da"><input id="a2" type="number" placeholder="A" min="1970" max="2030" aria-label="Anno a"></div></section>
  <section><label class="chk"><input id="ni" type="checkbox"> Solo senza immagine</label></section>
  <section id="pfs" hidden><h3>Nel pack</h3><div class="seg full" id="pf" role="group" aria-label="Filtro pack"></div></section>
 </aside>
 <main id="g"></main>
 <aside id="dw" class="drawer" aria-label="Pack e schede" hidden>
  <h2>Pack <button id="dx" class="x" type="button" aria-label="Chiudi il pannello" style="position:static"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h2>
  <div class="card">
   <h3>Pack attivo</h3>
   <select id="pk" aria-label="Pack"></select>
   <div class="row" style="margin-top:10px"><input id="npk" type="text" placeholder="Nome nuovo pack (es. SD 64 GB)" aria-label="Nome nuovo pack"><button id="npb" class="btn sm" type="button" style="flex:none">Crea pack</button></div>
  </div>
  <div id="pkd" hidden>
   <div class="card">
    <div class="gauge" id="bar"><div class="r"></div><div class="f"></div><div class="v"><b id="bg"></b><small id="bs"></small></div></div>
    <p class="note" id="bt"></p>
    <div class="f2">
     <label>Spazio utile (GB)<input id="pcap" type="number" min="1" step="1"></label>
     <label>Riserva (GB)<input id="pris" type="number" min="0" step="1"></label>
    </div>
   </div>
   <div class="card stack">
    <button id="pa" class="btn primary" type="button">Aggiungi i risultati</button>
    <button id="pr" class="btn" type="button">Togli i risultati</button>
    <div class="row"><button id="ps" class="btn" type="button">Riepilogo</button><button id="pe" class="btn" type="button">Esporta elenco</button></div>
   </div>
  </div>
  <div class="card" id="sdsec" hidden>
   <h3>Scheda SD o console</h3>
   <div class="stack">
    <select id="sds" aria-label="SD o console" hidden></select>
    <button id="pc" class="btn" type="button">Controlla rispetto al pack</button>
    <button id="sy" class="btn primary" type="button" title="Calcola cosa aggiungere e cosa togliere per allineare la scheda al pack. Non scrive nulla.">Sincronizza con il pack</button>
    <div class="row">
     <button id="sa" class="btn sm" type="button" title="Registra una scheda della console collegata">Aggiungi scheda</button>
     <button id="sr" class="btn sm" type="button" title="Cambia il nome della sorgente scelta (solo quelle aggiunte da qui)">Rinomina</button>
     <button id="sx" class="btn sm danger" type="button" title="Toglie la sorgente dall'elenco, non tocca la scheda">Rimuovi</button>
    </div>
    <div id="sf" class="stack" hidden>
     <select id="vol" aria-label="Volume rilevato"></select>
     <input id="nm" type="text" placeholder="Nome (es. SD 64 GB)" maxlength="40" aria-label="Nome della scheda">
     <button id="ss" class="btn primary" type="button">Salva scheda</button>
    </div>
   </div>
  </div>
  <button id="pd" class="link danger" type="button" hidden>Elimina pack</button>
 </aside>
</div>
<div id="pn" class="ov-b" hidden><div class="bx"><button class="x" id="px" type="button" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="pi"></div><div id="pt"></div></div></div>
<div id="rs" class="ov-b" hidden><div class="bx"><button class="x" id="rx" type="button" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="rt"></div></div></div>
<button id="più" class="btn" type="button" hidden>Mostra altri</button>
<script src="data.js"></script>
<script>
const GIOCABILI=new Set((window.CONFIG&&window.CONFIG.giocabili)||[]);
const D=window.GIOCHI||[],PAG=200;
const $=i=>document.getElementById(i);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// gruppo di pulsanti con selezione singola; espone .value e l'evento change come un select
function seg(id,opts,def){
 const e=$(id);e._v=def||'';
 opts.forEach(([v,l,t])=>{const b=document.createElement('button');b.type='button';b.dataset.v=v;b.title=t||'';
  if(l.startsWith('<'))b.innerHTML=l;else b.textContent=l;
  b.onclick=()=>{e.value=v;e.dispatchEvent(new Event('change'))};e.appendChild(b)});
 Object.defineProperty(e,'value',{get(){return this._v},set(v){this._v=v;[...this.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}});
 e.value=e._v}
seg('vs',[['','<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>','Griglia'],
 ['lista','<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>','Elenco']]);
seg('pl',[['','Tutti'],['1','1'],['2','2+'],['4','4+']]);
seg('mr',[['0','Tutti'],['3','3+ ★'],['4','4+ ★'],['4.5','4,5+ ★']],'0');
seg('pf',[['','Tutti'],['in','Nel pack'],['out','Fuori']]);
D.forEach(g=>{g.k=norm(g.t+' '+g.f);g.id=g.s+'/'+g.f});
const conta={};D.forEach(g=>conta[g.s]=(conta[g.s]||0)+1);
function voceSistema(v,nome,n){const b=document.createElement('button');b.type='button';b.dataset.v=v;b.append(nome);const c=document.createElement('span');c.textContent=n.toLocaleString('it');b.appendChild(c);
 b.onclick=()=>{$('s').value=(v&&$('s').value===v)?'':v;filtra()};$('sl').appendChild(b)}
voceSistema('','Tutti i sistemi',D.length);
Object.keys(conta).sort().forEach(s=>voceSistema(s,s,conta[s]));
const gen=[...new Set(D.flatMap(g=>g.c||[]))].sort((a,b)=>a.localeCompare(b,'it'));
gen.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;$('ge').appendChild(o)});
const stelle=r=>'★'.repeat(Math.floor(r))+(r%1?'½':'');
const NL={en:'Inglese',fr:'Francese',de:'Tedesco',es:'Spagnolo',it:'Italiano',nl:'Olandese',pt:'Portoghese',sv:'Svedese',no:'Norvegese',da:'Danese',fi:'Finlandese',ja:'Giapponese',zh:'Cinese',ko:'Coreano',ru:'Russo',pl:'Polacco',ca:'Catalano',cs:'Ceco',el:'Greco',tr:'Turco',hu:'Ungherese'};
const cl={};D.forEach(g=>(g.l||[]).forEach(x=>cl[x]=(cl[x]||0)+1));
Object.keys(cl).sort((a,b)=>cl[b]-cl[a]).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=(NL[x]||x)+' ('+cl[x]+')';$('lg').appendChild(o)});
{const o=document.createElement('option');o.value='-';o.textContent='Lingua non indicata ('+D.filter(g=>!g.l).length+')';$('lg').appendChild(o)}
let ris=[],mostrati=0;
const mb=n=>n?(n>=1e9?(n/1e9).toFixed(1)+' GB':(n/1e6).toFixed(1)+' MB'):'';
const maxP=p=>Math.max(...(p.match(/\d+/g)||[0]).map(Number));

 if(r.stato!=='finito'){p.textContent='Non riuscito: '+r.errore;return}
 const n=r.n,b=r.byte,netto=b.aggiungi+b.aggiorna-b.togli;
 p.textContent=n.aggiungi+n.aggiorna+n.togli?'Anteprima: nulla è stato modificato. Variazione di spazio sulla scheda: '+(netto>=0?'+':'−')+gb(Math.abs(netto))+'.':'La scheda è già allineata al pack.';
 const tiles=document.createElement('div');tiles.className='row';tiles.style.margin='12px 0';
 for(const k in SY){const d=document.createElement('div');d.className='card';d.style.cssText='flex:1;margin:0';
  const big=document.createElement('b');big.style.cssText='font-size:22px;color:'+(n[k]?SY[k][1]:'var(--mu)');big.textContent=n[k].toLocaleString('it');
  const sm=document.createElement('div');sm.className='note';sm.textContent=SY[k][0]+' · '+gb(b[k]);d.append(big,sm);tiles.appendChild(d)}
 rt.appendChild(tiles);
 const ss=Object.entries(r.per_sistema);
 if(ss.length){const tb=document.createElement('table');const th=document.createElement('tr');
  ['Sistema','Aggiungi','Aggiorna','Togli'].forEach(t=>{const c=document.createElement('th');c.textContent=t;th.appendChild(c)});tb.appendChild(th);
  ss.sort((a,c)=>(c[1].aggiungi[1]+c[1].aggiorna[1]+c[1].togli[1])-(a[1].aggiungi[1]+a[1].aggiorna[1]+a[1].togli[1])).forEach(([sis,x])=>{
   const tr=document.createElement('tr');[sis,...['aggiungi','aggiorna','togli'].map(k=>x[k][0]?x[k][0].toLocaleString('it')+' · '+gb(x[k][1]):'—')].forEach((v,i)=>{const c=document.createElement('td');
    if(!i){const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.s=sis;cb.className='sysel';cb.setAttribute('aria-label','Includi '+sis);cb.style.marginRight='8px';c.appendChild(cb)}
    c.append(v);tr.appendChild(c)});tb.appendChild(tr)});
  rt.appendChild(tb)}
 for(const k in SY){if(!n[k])continue;const d=document.createElement('details');const sm=document.createElement('summary');
  sm.textContent=SY[k][0]+' ('+n[k].toLocaleString('it')+')'+(n[k]>r.elenco[k].length?' — primi '+r.elenco[k].length.toLocaleString('it'):'');d.appendChild(sm);
  const pre=document.createElement('pre');pre.style.cssText='font-size:12px;max-height:240px;overflow:auto;white-space:pre-wrap';
  pre.textContent=r.elenco[k].map(x=>x[0]).join('\n');d.appendChild(pre);rt.appendChild(d)}
 if(n.aggiungi+n.aggiorna+n.togli)applicaUI(rt,p,id,r)
};
function applicaUI(rt,p,id,r){
 const n=r.n,box=document.createElement('div');box.className='stack';box.style.marginTop='14px';
 const opz=(testo,k,on)=>{const l=document.createElement('label');l.className='chk';const c=document.createElement('input');c.type='checkbox';c.checked=on;l.append(c,' '+testo);return [l,c]};
 const [l1,c1]=opz('Aggiungi e aggiorna ('+(n.aggiungi+n.aggiorna).toLocaleString('it')+' file)','a',n.aggiungi+n.aggiorna>0);
 const [l2,c2]=opz('Togli ('+n.togli.toLocaleString('it')+' file): vengono spostati in «_rimossi» sulla scheda, non cancellati','t',n.togli>0);
 c1.disabled=!(n.aggiungi+n.aggiorna);c2.disabled=!n.togli;
 const bt=document.createElement('button');bt.type='button';bt.className='btn primary';bt.textContent='Applica le modifiche';
 const msg=document.createElement('p');msg.className='note';
 let armato=false;
 const sistemi=()=>[...rt.querySelectorAll('.sysel')].filter(x=>x.checked).map(x=>x.dataset.s);
 const riarma=()=>{armato=false;bt.textContent='Applica le modifiche';bt.classList.remove('danger')};
 [c1,c2,...rt.querySelectorAll('.sysel')].forEach(x=>x.addEventListener('change',riarma));
 bt.onclick=async()=>{
  const nt=c2.checked&&!c2.disabled;
  if(!armato){armato=true;bt.textContent='Conferma: '+(c1.checked&&!c1.disabled?'copio i file scelti':'')+(c1.checked&&nt?' e ':'')+(nt?'sposto i file in _rimossi':'');return}
  bt.disabled=true;msg.textContent='Avvio…';const br=creaBarra(msg),t0=Date.now();
  const corpo={id,aggiungi:c1.checked&&!c1.disabled,togli:nt,sistemi:sistemi(),conferma_soglia:r.n.togli>0&&nt&&window._soglia===true};
  let x=await fetch('/api/sync/applica',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});
  if(x.status===409&&(await x.text()).includes('20%')){
   msg.textContent='Le rimozioni superano il 20% della scheda. Premi ancora per confermare.';window._soglia=true;bt.disabled=false;bt.textContent='Confermo: tolgo più del 20%';bt.classList.add('danger');armato=true;return}
  if(!x.ok){msg.textContent='Non avviata: '+(x.statusText||x.status);bt.disabled=false;riarma();return}
  const j=(await x.json()).id;let v;
  while(true){
   await new Promise(f=>setTimeout(f,1500));
   try{const y=await fetch('/api/sync?id='+j);v=await y.json()}catch(e){msg.textContent='Collegamento perso: '+e.message;return}
   if(v.stato!=='in corso')break;
   barra(br,descrivi(v,t0))}
  br.b.remove();
  window._soglia=false;
  if(v.stato!=='finito'){msg.textContent='Interrotta: '+v.errore+' Rifai l\'anteprima prima di riprovare.';return}
  bt.remove();l1.remove();l2.remove();
  msg.textContent='Fatto: '+v.aggiunti.toLocaleString('it')+' file copiati, '+v.tolti.toLocaleString('it')+' spostati'+(v.cestino?' in «'+v.cestino+'» sulla scheda':'')+'. Rifai la sincronizzazione per verificare che la scheda sia allineata.'}
 box.append(l1,l2,bt,msg);rt.appendChild(box)}

caricaPack();
</script>
</body>
</html>
