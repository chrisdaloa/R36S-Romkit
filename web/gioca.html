<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gioca</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:15px system-ui,sans-serif}
#game{width:100%;height:100%}
#bar{position:fixed;top:0;left:0;right:0;z-index:20;padding:6px 12px;background:rgba(0,0,0,.6);font-size:13px;display:flex;gap:12px;align-items:center}
#bar a{color:#9cf}
</style>
</head>
<body>
<div id="bar"><a href="index.html">← Catalogo</a><span id="tit"></span><span>Comandi: frecce, Z/X = B/A, Invio = Start, Maiusc = Select</span></div>
<div id="game"></div>
<script>
const q=new URLSearchParams(location.search),s=q.get('s'),f=q.get('f');
const CORE={nes:'nes',snes:'snes',gb:'gb',gbc:'gb',gba:'gba',megadrive:'segaMD',mastersystem:'segaMS',gamegear:'segaGG',pcengine:'pce',ngp:'ngp',ngpc:'ngp'};
document.getElementById('tit').textContent=f||'';
document.title='Gioca – '+(f||'');
EJS_player='#game';
EJS_core=CORE[s];
EJS_gameUrl='rom/'+encodeURIComponent(s)+'/'+encodeURIComponent(f);
EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
EJS_startOnLoaded=true;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
